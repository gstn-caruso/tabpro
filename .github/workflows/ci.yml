name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # setup-java cache keys by pom hash with no fallback: as release rewrites the version in all six poms,
      # each release would start with an empty repository and re-download everything. With restore-keys,
      # the new version starts from the previous one and only downloads what changed.
      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build and test
        run: mvn -B verify

      - name: Tests under a Spanish locale
        run: mvn -B test -Dtests.locale="-Duser.language=es -Duser.country=ES"

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Integration tests
        run: xvfb-run -a mvn -B test -Dtests.headless=false -Dgroups=integration -Dtests.excluded.groups= -Dsurefire.failIfNoSpecifiedTests=false

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # setup-java cache keys by pom hash with no fallback: as release rewrites the version in all six poms,
      # each release would start with an empty repository and re-download everything. With restore-keys,
      # the new version starts from the previous one and only downloads what changed.
      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
