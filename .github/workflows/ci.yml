name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # El cache de setup-java keyea por el hash de los poms y no tiene fallback:
      # como el release reescribe la version en los seis poms, cada version
      # arrancaba con el repositorio vacio y volvia a bajar todo. Con restore-keys
      # la version nueva parte de la anterior y solo baja lo que cambio.
      - name: Cache del repositorio de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build and test
        run: mvn -B verify

      - name: Instalar Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Tests de integracion
        run: xvfb-run -a mvn -B test -Dtests.headless=false -Dgroups=integracion -Dtests.excluded.groups= -Dsurefire.failIfNoSpecifiedTests=false

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # El cache de setup-java keyea por el hash de los poms y no tiene fallback:
      # como el release reescribe la version en los seis poms, cada version
      # arrancaba con el repositorio vacio y volvia a bajar todo. Con restore-keys
      # la version nueva parte de la anterior y solo baja lo que cambio.
      - name: Cache del repositorio de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
